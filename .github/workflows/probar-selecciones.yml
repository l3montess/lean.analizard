name: Probar selecciones
# Revisa si API-Football trae la Nations League (partidos, tablas y temporadas) con tu plan.
# Uso: pestaña Actions → "Probar selecciones" → Run workflow → abrir la ejecución → paso "Consultar".
on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Consultar
        run: node scripts/probar_selecciones.mjs
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
