name: Actualizar datos
on:
  schedule: [{ cron: '0 8 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update.mjs
        env: { FOOTBALL_DATA_KEY: '${{ secrets.FOOTBALL_DATA_KEY }}' }
      - run: |
          git config user.name "datos-bot"; git config user.email "bot@users.noreply.github.com"
          git add data.js; git diff --cached --quiet || (git commit -m "Actualizar datos" && git push)
