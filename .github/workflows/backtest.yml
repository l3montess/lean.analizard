name: Probar modelo
on:
  workflow_dispatch:
permissions: { contents: write }
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Bajar historial (football-data.co.uk, sin clave)
        run: node scripts/history.mjs --force
      - name: Probar modelos contra partidos ya jugados
        run: node scripts/backtest.mjs
      - run: |
          git config user.name "datos-bot"; git config user.email "bot@users.noreply.github.com"
          git add history.json backtest.json
          git diff --cached --quiet || (git commit -m "Historial y resultados de la prueba" && git pull --rebase && git push)

