name: Probar premium
# Simula partidos anteriores con el modelo premium (goles +1,5, córners, tarjetas, remates) y muestra el resultado en el log.
# Uso: pestaña Actions → "Probar premium" → Run workflow → abrir la ejecución → paso "Simular partidos anteriores".
on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bajar historial (football-data.co.uk)
        run: node scripts/history.mjs --force
      - name: Simular partidos anteriores
        run: node scripts/backtest_premium.mjs
